<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script defer src="js/main.js"></script>
  <link rel="stylesheet" href="css/main.css" />
  <title>Omnibus API</title>
</head>

<body>
  <header class="topbar">
    <h1>Omnibus API</h1>

    <div class="base">
      <label for="baseUrl">Base URL</label>
      <input id="baseUrl" class="base__input" type="text" value="http://andre:3019" />
      <button type="button" id="applyBase" class="btn">Apply</button>
      <button type="button" id="copyBase" class="btn">Copy base</button>
    </div>

    <p class="hint">
      Click <b>Open</b> (GET only) or click the URL preview to load the response in the viewer.
      Routes with <code>:params</code> require inputs before loading.
    </p>
  </header>

  <div class="layout">
    <main class="main" id="app"></main>

    <aside class="viewer">
      <div class="viewer__header">
        <span id="viewerUrl">No request loaded</span>
        <button id="refreshFrame" class="btn btn--small" type="button">Refresh</button>
        <button id="clearFrame" class="btn btn--small" type="button">Clear</button>
      </div>

      <iframe
        id="apiFrame"
        class="viewer__frame"
        title="API Response"
      ></iframe>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
