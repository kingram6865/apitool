<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script defer src="js/main.js"></script>
  <link rel="stylesheet" href="css/main.css">
  <title>Omnibus API</title>
</head>
<body>
<body>
  <header class="topbar">
    <h1>Omnibus API</h1>

    <div class="base">
      <label for="baseUrl">Base URL</label>
      <input id="baseUrl" class="base__input" type="text" value="http://andre:3019" />
      <button type="button" id="applyBase" class="btn">Apply</button>
      <button type="button" id="copyBase" class="btn">Copy base</button>
    </div>

    <p class="hint">
      Tip: routes with <code>:params</code> will show inputs + <b>Open</b>/<b>Copy URL</b>/<b>Copy curl</b>.
      Open only really makes sense for <b>GET</b>.
    </p>
  </header>

  <main class="main" id="app"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
