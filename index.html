<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script defer src="js/main.js"></script>
  <link rel="stylesheet" href="css/main.css" />
  <title>Omnibus API</title>
</head>

<body>
  <header class="topbar">
    <div class="topbar__inner">
      <h1>Omnibus API</h1>

      <div class="base">
        <label for="baseUrl">Base URL</label>
        <input id="baseUrl" class="base__input" type="text" value="http://andre:3019" />
        <button type="button" id="applyBase" class="btn">Apply</button>
        <button type="button" id="copyBase" class="btn">Copy base</button>
      </div>

      <p class="hint">
        Click <b>Open</b> (GET only) or click the URL preview to load the response in the viewer.
        Routes with <code>:params</code> require inputs before loading.
      </p>
    </div>
  </header>

  <!-- App shell: fixed-height panels with internal scrolling -->
  <div class="shell">
    <main class="panel panel--routes">
      <div class="panel__scroll" id="app"></div>
    </main>

    <aside class="panel panel--viewer">
      <div class="viewer__header">
        <span id="viewerUrl">No request loaded</span>
        <button id="expandAll" class="btn btn--small" type="button">Expand All</button>
        <button id="collapseAll" class="btn btn--small" type="button">Collapse All</button>
        <label class="viewer__depth">
          Depth
          <input id="expandDepth" class="depth__input" type="number" min="0" max="50" value="2" />
        </label>
        <button id="expandToDepth" class="btn btn--small" type="button">Expand</button>

        <button id="refreshFrame" class="btn btn--small" type="button">Refresh</button>
        <button id="clearFrame" class="btn btn--small" type="button">Clear</button>
      </div>

      <div class="viewer__body">
        <div id="jsonViewer" class="viewer__json hidden"></div>
        <iframe
          id="apiFrame"
          class="viewer__frame"
          title="API Response"
        ></iframe>
      </div>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
